<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="conta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    
    <main class="app">

        <header class="perfil">
            <div class="conta">
                <span><i class="fa-solid fa-user"></i></span>
            </div>

            <h2>Visitante</h2>
            <span class="status"></span>
        </header>
    </main>

    <section class="opcoes">
        <button class="opcao">
            <span>Convidar Integrantes</span>
            <small>Admin</small>
        </button>

        <button class="opcao">
            <span>Definir Funções de Equipe</span>
            <small>Admin</small>
        </button>
        
        <button class="opcao">
            <span>Sincronizar Conta</span>
            <small>Admin</small>
        </button>

    </section>

    <section class="configuracoes">
        <h3>Configurações</h3>
        <div class="config-item">
            <span><i class="fa-solid fa-bell"></i> Notificações Push </span>

            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

          <div class="config-item">
            <span> ☾ &nbsp; Modo Escuro </span>

            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

    </section>

    <div class="login-area">
            <button class="login-btn">Faça Login / Cadastrar</button>
        </div>

        <nav class="navbar">
            <a href="#">
                <span><i class="fa-solid fa-table"></i></span>
                <small>Dashboard</small>
            </a>

            <a href="#">
                <span><i class="fa-solid fa-message"></i></span>
                <small>Canais</small>
            </a>

            <a href="#">
                <span><i class="fa-solid fa-calendar-days"></i></span>
                <small>Scrum</small>
            </a>

            <a href="#">
                <span><i class="fa-solid fa-play"></i></span>
                <small>Atividade</small>
            </a>

            <a href="#" class="ativo">
                <span><i class="fa-solid fa-circle-user"></i></span>
                <small>Perfil</small>
            </a>
        </nav>

        <div class="barra-sistema"></div>

    </main>

</body>
</html>
